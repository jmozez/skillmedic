# Update pull requests from Dependabot are not merged directly. Apply the
# same change on a normal branch so every commit is authored by the maintainer,
# then let Dependabot close its pull request as superseded.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev:
        dependency-type: development
    ignore:
      # @types/node tracks the oldest supported Node.js release (22).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # init and analyze must run the same version, so update them together.
      codeql:
        patterns:
          - "github/codeql-action*"
